spring.application.name=mysql-mcp-server

server.port=8090

# Local development: bind only to localhost
server.address=127.0.0.1

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/micro_yt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MCP Server Configuration
spring.ai.mcp.server.protocol=STREAMABLE

spring.ai.mcp.server.name=mysql-mcp-server
spring.ai.mcp.server.version=1.0.0

spring.ai.mcp.server.instructions=This server provides read-only MySQL database tools.

spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# Logs
logging.level.org.springframework.ai=DEBUG
logging.level.com.example.mysqlmcp=DEBUG